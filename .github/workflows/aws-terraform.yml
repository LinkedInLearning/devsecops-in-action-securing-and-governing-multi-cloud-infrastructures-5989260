name: 'AWS Terraform'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/aws/**'
      - 'app/frontend/**'
  pull_request:
    paths:
      - 'infra/aws/**'
      - 'app/frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-terraform:
    name: 'AWS Terraform'
    runs-on: ubuntu-latest
    env:
      TF_VAR_tg_api_key: ${{ secrets.TWINGATE_API_KEY }}
      TF_VAR_doppler_token: ${{ secrets.DOPPLER_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: infra/aws

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Authenticate to AWS
    - name: Configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::891572013258:role/github-terraform-deploy
        aws-region: us-east-1

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false

      # Only on push to "main", change infrastructure according to Terraform configuration files
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: terraform apply -auto-approve -input=false
