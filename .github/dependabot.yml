version: 2
updates:
  # Frontend app (deployed on AWS)
  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: daily
    labels: [dependencies, javascript, aws]
    groups:
      aws-sdks:
        patterns: ["@aws-sdk/*"]
        applies-to: security-updates
      minor-patch:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  # Backend app (deployed on Azure)
  - package-ecosystem: "npm"
    directory: "/app/backend"
    schedule:
      interval: daily
    labels: [dependencies, javascript, azure]
    groups:
      azure-sdks:
        patterns: ["@azure/*"]
        applies-to: security-updates
      minor-patch:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  # Terraform – AWS
  - package-ecosystem: "terraform"
    directory: "/infra/aws"
    schedule:
      interval: daily
    labels: [dependencies, terraform, aws]

  # Terraform – Azure
  - package-ecosystem: "terraform"
    directory: "/infra/azure"
    schedule:
      interval: daily
    labels: [dependencies, terraform, azure]

  # Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
